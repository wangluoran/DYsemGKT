[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dysemkt"
version = "0.1.0"
description = "A compact semantic dynamic-graph knowledge tracing research project"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "torch>=2.1",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
dysemkt = "dysemkt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
default-groups = ["dev"]

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
